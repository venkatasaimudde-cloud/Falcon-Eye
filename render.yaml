services:
  - type: web
    name: falcon-eye
    runtime: python
    buildCommand: "pip install -r requirements.txt && python sample_data/seed_db.py && python sample_data/generate_samples.py"
    startCommand: "python run.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
